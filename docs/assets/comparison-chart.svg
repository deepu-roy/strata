<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <linearGradient id="strataBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="420" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="430" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f0f6fc" text-anchor="middle">Feature coverage vs. comparable tools</text>
  <text x="430" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">● = fully supported  ◑ = partial  ○ = not supported</text>

  <!-- Column headers -->
  <text x="20"  y="88" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Feature</text>
  <text x="310" y="88" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#2ea043" text-anchor="middle">Strata</text>
  <text x="395" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Vector DB</text>
  <text x="480" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">ctags</text>
  <text x="565" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Sourcegraph</text>
  <text x="655" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">LSP</text>
  <text x="740" y="88" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SonarQube</text>

  <!-- Header underline -->
  <line x1="20" y1="94" x2="840" y2="94" stroke="#30363d" stroke-width="1"/>

  <!-- Data rows — y positions: 118, 148, 178, 208, 238, 268, 298, 328, 358, 388 -->

  <!-- Row 1: Structural call graph -->
  <text x="20" y="118" font-family="-apple-system, sans-serif" font-size="12" fill="#c9d1d9">Structural call graph</text>
  <circle cx="310" cy="113" r="7" fill="#2ea043"/>
  <circle cx="395" cy="113" r="7" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="395" y="118" font-family="sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">○</text>
  <text x="480" y="118" font-family="sans-serif" font-size="12" fill="#f0883e" text-anchor="middle">◑</text>
  <text x="565" y="118" font-family="sans-serif" font-size="12" fill="#f0883e" text-anchor="middle">◑</text>
  <circle cx="655" cy="113" r="7" fill="#2ea043"/>
  <text x="740" y="118" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>

