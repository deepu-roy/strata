  <line x1="20" y1="158" x2="840" y2="158" stroke="#21262d" stroke-width="0.5"/>
  <line x1="20" y1="188" x2="840" y2="188" stroke="#21262d" stroke-width="0.5"/>
  <line x1="20" y1="218" x2="840" y2="218" stroke="#21262d" stroke-width="0.5"/>
