  <text x="655" y="388" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>
  <text x="740" y="388" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>

