  <text x="395" y="358" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>
  <text x="480" y="358" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>
  <text x="565" y="358" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>
  <text x="655" y="358" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>
  <text x="740" y="358" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">○</text>

