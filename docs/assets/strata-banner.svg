<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <!-- Decorative graph edges (background) -->
  <line x1="720" y1="40"  x2="800" y2="90"  stroke="#1f6feb" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="90"  x2="850" y2="50"  stroke="#1f6feb" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="90"  x2="830" y2="150" stroke="#2ea043" stroke-width="1" opacity="0.3"/>
  <line x1="830" y1="150" x2="770" y2="170" stroke="#2ea043" stroke-width="1" opacity="0.3"/>
  <line x1="770" y1="170" x2="720" y2="130" stroke="#1f6feb" stroke-width="1" opacity="0.25"/>
  <line x1="720" y1="130" x2="720" y2="40"  stroke="#2ea043" stroke-width="1" opacity="0.25"/>
  <line x1="720" y1="40"  x2="770" y2="170" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
  <line x1="850" y1="50"  x2="830" y2="150" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Graph nodes (background) -->
  <circle cx="720" cy="40"  r="6" fill="#1f6feb" opacity="0.6"/>
  <circle cx="800" cy="90"  r="8" fill="#2ea043" opacity="0.7"/>
  <circle cx="850" cy="50"  r="5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="830" cy="150" r="6" fill="#1f6feb" opacity="0.6"/>
  <circle cx="770" cy="170" r="7" fill="#2ea043" opacity="0.6"/>
  <circle cx="720" cy="130" r="5" fill="#58a6ff" opacity="0.5"/>

  <!-- More faint nodes far right -->
  <circle cx="870" cy="130" r="4" fill="#2ea043" opacity="0.3"/>
  <line x1="830" y1="150" x2="870" y2="130" stroke="#2ea043" stroke-width="0.5" opacity="0.2"/>

  <!-- Accent line under title area -->
  <rect x="60" y="145" width="200" height="3" fill="url(#accent)" rx="2"/>

  <!-- Main title -->
  <text x="60" y="110" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="72" font-weight="700" fill="white" letter-spacing="-2">STRATA</text>

  <!-- Subtitle -->
  <text x="62" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e">Code Knowledge Graph · tree-sitter → Neo4j → MCP</text>

  <!-- Right side stat cards -->
  <!-- Card 1 -->
  <rect x="60" y="188" width="80" height="22" fill="#21262d" rx="4"/>
  <text x="100" y="203" font-family="-apple-system, sans-serif" font-size="11" fill="#2ea043" font-weight="600" text-anchor="middle">16 MCP tools</text>

  <!-- Card 2 -->
  <rect x="148" y="188" width="80" height="22" fill="#21262d" rx="4"/>
  <text x="188" y="203" font-family="-apple-system, sans-serif" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">4 languages</text>

  <!-- Card 3 -->
  <rect x="236" y="188" width="90" height="22" fill="#21262d" rx="4"/>
  <text x="281" y="203" font-family="-apple-system, sans-serif" font-size="11" fill="#f0883e" font-weight="600" text-anchor="middle">~8ms avg query</text>
</svg>
