services:
  code-kg-mcp:
    build: .
    image: code-kg:dev
    # All settings are read from .env — no hardcoded values here.
    environment:
      NEO4J__URI: ${NEO4J__URI}
      NEO4J__USER: ${NEO4J__USER}
      NEO4J__PASSWORD: ${NEO4J__PASSWORD}
      EMBEDDING__PROVIDER: ${EMBEDDING__PROVIDER:-sentence_transformers}
      EMBEDDING__MODEL: ${EMBEDDING__MODEL:-BAAI/bge-small-en-v1.5}
      # The provider is the prefix of SUMMARY__MODEL (ollama/…, anthropic/…, openai/…,
      # openrouter/…); SUMMARY__PROVIDER is only read for a legacy bare model name.
      SUMMARY__PROVIDER: ${SUMMARY__PROVIDER:-}
      # Leave empty to use each provider's own endpoint. Only set it for a custom endpoint
      # (an OpenAI-compatible server, or Ollama on another host).
      SUMMARY__BASE_URL: ${SUMMARY__BASE_URL:-}
      # Ollama models resolve to the bundled ollama service on the Docker network. To use
      # Ollama on your host instead, set OLLAMA_API_BASE=http://host.docker.internal:11434
      # in .env and comment out the ollama + ollama-init services below.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      SUMMARY__MODEL: ${SUMMARY__MODEL:-ollama/qwen2.5-coder:7b}
      SUMMARY__API_KEY: ${SUMMARY__API_KEY:-}
      # Providers' own key variables (LiteLLM reads these); set the one you use in .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SUMMARY__TEMPERATURE: ${SUMMARY__TEMPERATURE:-0.1}
      SUMMARY__MAX_CONCURRENT: ${SUMMARY__MAX_CONCURRENT:-1}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HTTP_HOST: ${MCP_HTTP_HOST:-0.0.0.0}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8765}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional — suppresses HuggingFace rate-limit warnings on first model download.
      # Safe to leave empty; model is cached in hf-cache volume after first run.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${MCP_HTTP_PORT:-8765}:${MCP_HTTP_PORT:-8765}"
    volumes:
      - ./workdir:/app/workdir
      - ${REPO_PATH:-./workdir}:/mnt/repo
      - hf-cache:/root/.cache/huggingface
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    networks:
      - code-kg

  # Waits for the ollama service to be ready, then pulls the configured model — but only when
  # SUMMARY__MODEL is an Ollama model (``ollama/…`` or a bare name). A cloud model such as
  # ``anthropic/…`` or ``openai/…`` is skipped. ``ollama pull`` is idempotent.
  ollama-init:
    image: ollama/ollama:latest
    entrypoint: >
      sh -c "
        M='${SUMMARY__MODEL:-ollama/qwen2.5-coder:7b}' &&
        case $$M in
          anthropic/*|openai/*|azure/*|openrouter/*|bedrock/*|vertex_ai/*|gemini/*|groq/*|mistral/*|together_ai/*|deepseek/*|xai/*|cohere/*|huggingface/*|hosted_vllm/*|lm_studio/*)
            echo \"$$M is not an Ollama model; nothing to pull.\"; exit 0 ;;
          ollama/*|ollama_chat/*) M=$${M#*/} ;;
        esac &&
        echo 'Waiting for Ollama service...' &&
        until OLLAMA_HOST=http://ollama:11434 ollama list > /dev/null 2>&1; do sleep 2; done &&
        echo \"Pulling $$M...\" &&
        OLLAMA_HOST=http://ollama:11434 ollama pull $$M &&
        echo 'Model ready.'
      "
    environment:
      SUMMARY__MODEL: ${SUMMARY__MODEL:-ollama/qwen2.5-coder:7b}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - code-kg

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - code-kg

  # Optional: Local Neo4j for testing (comment out to use Aura)
  neo4j:
    image: neo4j:5.15
    environment:
      NEO4J_AUTH: neo4j/${NEO4J__PASSWORD:-password123}
      NEO4J_server_memory_pagecache_size: 2G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/var/lib/neo4j/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - code-kg

volumes:
  hf-cache:
  neo4j-data:
  ollama-data:

networks:
  code-kg:
